version: "3.9"
services:

  similarity:
    image: similarity:0.3.0
    ports: ["5000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      retries: 5

  cleaner:
    image: sheets-data-cleaner:latest
    environment:
      EMBEDDING_API_URL: http://similarity:5000
    depends_on:
      - similarity
    ports:
      - "8080"
