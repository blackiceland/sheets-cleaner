services:
  similarity:
    build:
      context: ./similarity
    image: similarity:0.3.0
    ports:
      - "5000:5000"

  cleaner:
    image: sheets-data-cleaner:latest
    environment:
      EMBEDDING_API_URL: http://similarity:5000
    depends_on:
      - similarity
    ports:
      - "8080:8080"
