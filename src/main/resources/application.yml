spring.application.name: sheets-data-cleaner

server:
  port: 8081

  tomcat:
    max-http-form-post-size: 15MB       # строкой или в кавычках
    threads:
      max: 30                           # было max-threads
      min-spare: 10                     # было min-spare-threads
    accept-count: 50

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,configprops
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

embedding:
  api:
    base-url: http://embedding:5000/similarity

logging:
  level:
    root: INFO
    mas.sheets.sheetsdatacleaner: DEBUG          # ← ваш пакет

resilience4j:
  bulkhead:
    instances:
      embeddingApi:
        maxConcurrentCalls: 8           # ≤ число CPU-ядер
        maxWaitDuration: 50ms
        writableStackTraceEnabled: false
      duplicateDetector: # имя произвольное
        maxConcurrentCalls: 20     # сколько findDuplicates можно держать одновременно
        maxWaitDuration: 200ms     # запросы сверх лимита ждут 200 мс → 429

  timelimiter:
    instances:
      embeddingApi:
        timeoutDuration: 3s             # 2–3× p95 latency
        cancelRunningFuture: true

  ratelimiter:
    instances:
      embeddingApi:
        limitForPeriod: 100             # 100 запросов
        limitRefreshPeriod: 1s          # …каждую секунду
        timeoutDuration: 0              # не ждём в очереди

  circuitbreaker:
    instances:
      embeddingApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20           # смотрим последние 20 вызовов
        failureRateThreshold: 50        # ≥50 % ошибок → open
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 30s    # пауза перед half-open
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.lang.RuntimeException
        ignoreExceptions:
          - java.util.concurrent.CancellationException
        writableStackTraceEnabled: false

duplicate:
  min-similarity: ${DUP_MIN_SIM:85}
  batch-size: ${DUP_BATCH_SIZE:1000}

telegram:
  bot:
    token: ${TG_BOT_TOKEN}