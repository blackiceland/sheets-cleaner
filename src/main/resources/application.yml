spring:
  application:
    name: sheets-data-cleaner
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

cleaner:
  audience: ${OAUTH_CLIENT_ID:your-client-id.apps.googleusercontent.com}

embedding:
  api:
    base-url: ${EMBEDDING_BASE_URL:http://localhost:5000/similarity}

server:
  port: 8081
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 8MB
    threads:
      max: 30
      min-spare: 10
    accept-count: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,configprops
  metrics:
    enable:
      executor.queue.remaining: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: DEBUG
    mas.sheets.sheetsdatacleaner.service.impl.DuplicateDetectionServiceImpl: DEBUG

resilience4j:
  bulkhead:
    instances:
      embeddingApi:
        maxConcurrentCalls: 8
        maxWaitDuration: 50ms
        writableStackTraceEnabled: false
      duplicateDetector:
        maxConcurrentCalls: 20
        maxWaitDuration: 200ms
        writableStackTraceEnabled: false
  timelimiter:
    instances:
      embeddingApi:
        timeoutDuration: 3s
        cancelRunningFuture: true
  ratelimiter:
    instances:
      embeddingApi:
        limitForPeriod: 200
        limitRefreshPeriod: 1s
        timeoutDuration: 2s
  circuitbreaker:
    instances:
      embeddingApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.lang.RuntimeException
        ignoreExceptions:
          - java.util.concurrent.CancellationException
        writableStackTraceEnabled: false

  thread-pool-bulkhead:
    instances:
      embeddingApi:
        coreThreadPoolSize: 2
        maxThreadPoolSize: 2
        queueCapacity: 50

minhash:
  max-batch: ${MINHASH_MAX_BATCH:100000}
  max-len: ${MINHASH_MAX_LEN:1000}
  max-pairs-per-row: ${MINHASH_MAX_PAIRS_PER_ROW:30}
  short-row-max-length: ${MINHASH_SHORT_ROW_MAX_LENGTH:20}
  very-short-len: ${MINHASH_VERY_SHORT_LEN:18}
  min-overlap-very-short: ${MINHASH_MIN_OVERLAP_VS:5}
  min-ngram-overlap: ${MINHASH_MIN_NGRAM_OVERLAP:8}
  lsh:
    band-size: ${MINHASH_LSH_BAND_SIZE:4}
    band-count: ${MINHASH_LSH_BAND_COUNT:32}
    thr-short: ${MINHASH_LSH_THR_SHORT:0.22}
    thr-long: ${MINHASH_LSH_THR_LONG:0.23}

duplicate-detector:
  hard-reject-short: ${DD_HARD_REJECT_SHORT:0.15}
  hard-reject-long: ${DD_HARD_REJECT_LONG:0.25}
  fast-reject-threshold: ${DD_FAST_REJECT_THRESHOLD:0.35}
  fast-confirm-short: ${DD_FAST_CONFIRM_SHORT:0.64}
  fast-confirm-long: ${DD_FAST_CONFIRM_LONG:0.62}
  short-len-limit: ${DD_SHORT_LEN_LIMIT:30}
  nn-len-limit: ${DD_NN_LEN_LIMIT:15}
  nn-confirm-short: ${DD_NN_CONFIRM_SHORT:0.65}
  nn-confirm-long: ${DD_NN_CONFIRM_LONG:0.60}
  token-weight: ${DD_TOKEN_WEIGHT:0.10}
  lev-weight: ${DD_LEV_WEIGHT:0.45}
  jw-weight: ${DD_JW_WEIGHT:0.45}
  neural-batch-size: ${DD_NEURAL_BATCH_SIZE:50}
  max-in-flight: ${DD_MAX_IN_FLIGHT:4000}
  worker-multiplier: ${DD_WORKER_MULTIPLIER:2}
  to-neural-max: ${DD_TO_NEURAL_MAX:200}
  to-neural-pct: ${DD_TO_NEURAL_PCT:2}
  nn-overflow-candidate-min-score: ${DD_NN_OVERFLOW_CANDIDATE_MIN_SCORE:0.50}

token:
  secret: ${TOKEN_SECRET:0123456789abcdef0123456789abcdef}
