spring:
  application:
    name: sheets-data-cleaner

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

embedding.api.base-url: ${EMBEDDING_BASE_URL}

server:
  port: 8081

  tomcat:
    max-http-form-post-size: 8MB
    threads:
      max: 30
      min-spare: 10
    accept-count: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,configprops

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    mas.sheets.sheetsdatacleaner: ${LOG_LEVEL_MAS:INFO}

resilience4j:
  bulkhead:
    instances:
      embeddingApi:
        maxConcurrentCalls: 8
        maxWaitDuration: 50ms
        writableStackTraceEnabled: false
      duplicateDetector:
        maxConcurrentCalls: 20
        maxWaitDuration: 200ms
        writableStackTraceEnabled: false

  timelimiter.instances.embeddingApi:
    timeoutDuration: 3s
    cancelRunningFuture: true

  ratelimiter.instances.embeddingApi:
    limitForPeriod: 200
    limitRefreshPeriod: 1s
    timeoutDuration: 0

  circuitbreaker.instances.embeddingApi:
    slidingWindowType: COUNT_BASED
    slidingWindowSize: 20
    failureRateThreshold: 50
    slowCallRateThreshold: 50
    slowCallDurationThreshold: 2s
    waitDurationInOpenState: 30s
    permittedNumberOfCallsInHalfOpenState: 5
    automaticTransitionFromOpenToHalfOpenEnabled: true
    recordExceptions:
      - java.lang.RuntimeException
    ignoreExceptions:
      - java.util.concurrent.CancellationException
    writableStackTraceEnabled: false
