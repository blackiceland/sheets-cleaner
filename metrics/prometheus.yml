global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cleaner
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cleaner:8082"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml


