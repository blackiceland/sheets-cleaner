# metrics/docker-compose.yml
version: "3.9"

services:
  # --- business services ----------------------------------------------------
  cleaner:
    build:
      # Dockerfile лежит в корне проекта
      context: ..
      dockerfile: Dockerfile        # если файл называется просто Dockerfile — строку можно убрать
    image: sheets-data-cleaner:latest
    ports: ["8081:8081"]            # основное API
    environment:
      MANAGEMENT_SERVER_PORT: 8082  # Actuator → 8082
    healthcheck:
      test: curl -f http://localhost:8082/actuator/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 3

  similarity:
    build:
      # Dockerfile модели лежит в папке /similarity
      context: ../similarity
      dockerfile: Dockerfile
    image: sheets-similarity:latest
    ports: ["5000:5000"]
    healthcheck:
      test: curl -f http://localhost:5000/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 3

  # --- observability --------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      # файл находится рядом с текущим docker-compose.yml
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    depends_on: [cleaner, similarity]

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # provisioning каталоги лежат в metrics/grafana/…
      - ./grafana:/etc/grafana/provisioning
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  prom-data:
  grafana-data:
