options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE: cleaner
  _IMAGE: gcr.io/$PROJECT_ID/cleaner:${SHORT_SHA}

steps:
  - name: gcr.io/cloud-builders/mvn
    args: [-B, clean, package, -DskipTests]

  - name: gcr.io/cloud-builders/docker
    args: [build, -t, ${_IMAGE}, .]

  - name: gcr.io/cloud-builders/docker
    args: [push, ${_IMAGE}]

  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=us-central1
      - --platform=managed
      - --quiet

images:
  - ${_IMAGE}
