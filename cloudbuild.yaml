options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: docker.io/library/maven:3.9.6-eclipse-temurin-21
    entrypoint: mvn
    args:
      - "-B"
      - "clean"
      - "package"
      - "-DskipTests"

  - name: gcr.io/cloud-builders/docker
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/cleaner:${SHORT_SHA}"
      - "."

  - name: gcr.io/cloud-builders/docker
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/cleaner:${SHORT_SHA}"

  - name: gcr.io/cloud-builders/gcloud
    args:
      - "run"
      - "deploy"
      - "cleaner"
      - "--image=gcr.io/$PROJECT_ID/cleaner:${SHORT_SHA}"
      - "--region=us-central1"
      - "--platform=managed"
      - "--quiet"

images:
  - "gcr.io/$PROJECT_ID/cleaner:${SHORT_SHA}"
