name: performance

on:
  # запуск вручную из вкладки Actions
  workflow_dispatch:

  # проверяем каждый pull-request → main
  pull_request:
    branches: [ main ]

  # прямой пуш в main
  push:
    branches: [ main ]

  # ночной прогон (02:00 UTC)
  schedule:
    - cron: '0 2 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      # 1. клонируем репозиторий
      - uses: actions/checkout@v4

      # 2. делаем wrapper исполняемым (иначе «permission denied»)
      - name: Make mvnw executable
        run: chmod +x mvnw

      # 3. собираем JAR (без юнит-тестов, чтобы ускорить)
      - name: Build JAR
        run: ./mvnw -B clean package -DskipTests

      # 4. строим образ приложения
      - name: Build app image
        run: docker build -t sheets-data-cleaner:latest .

      # 5. поднимаем сервис + модель
      - name: Compose up
        run: docker compose up -d

      # 6. запускаем smoke-тест k6
      - name: Run smoke test
        run: |
          NETWORK_ID=$(docker network ls --filter name=sheets-data-cleaner -q)
          docker run --rm \
            -v ${{ github.workspace }}:/scripts \
            --network $NETWORK_ID \
            grafana/k6 run /scripts/smoke.js

      # 7. чистим окружение независимо от статуса
      - name: Compose down
        if: always()
        run: docker compose down --volumes
