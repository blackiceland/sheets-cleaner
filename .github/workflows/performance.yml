name: performance

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw -B clean package -DskipTests

      # ---------- новый шаг ----------
      - name: Build similarity image
        run: docker build -t similarity:0.3.0 ./similarity
      # -------------------------------

      - name: Build app image
        run: docker build -t sheets-data-cleaner:latest .

      - name: Compose up
        run: docker compose up -d

      - name: Run smoke test
        run: |
          NET=$(docker network ls --filter name=sheets-data-cleaner -q)
          docker run --rm \
            -v ${{ github.workspace }}:/scripts \
            --network $NET \
            grafana/k6 run /scripts/smoke.js

      - name: Compose down
        if: always()
        run: docker compose down --volumes
