name: performance

on:
  workflow_dispatch:               # запуск по кнопке
  pull_request:                    # каждый PR → main
    branches: [ main ]
  push:                            # прямой пуш в main
    branches: [ main ]
  schedule:                        # ночной прогон (02:00 UTC)
    - cron: '0 2 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      # ---------- исходники ----------
      - uses: actions/checkout@v4

      # ---------- JDK 24 ----------
      - name: Set up Temurin 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      # ---------- Maven wrapper исполняемый ----------
      - name: Make mvnw executable
        run: chmod +x mvnw

      # ---------- сборка JAR сервиса ----------
      - name: Build JAR
        run: ./mvnw -B clean package -DskipTests

      # ---------- сборка образа модели ----------
      - name: Build similarity image
        run: docker build -t similarity:0.3.0 ./similarity

      # ---------- сборка образа сервиса ----------
      - name: Build app image
        run: docker build -t sheets-data-cleaner:latest .

      # ---------- поднимаем связку ----------
      - name: Compose up
        run: docker compose up -d

      # ---------- smoke-тест k6 ----------
      - name: Run smoke test
        run: |
          docker run --rm \
            --network sheets-data-cleaner_default \
            -v ${{ github.workspace }}:/scripts \
            grafana/k6 run /scripts/smoke.js
        shell: bash

      # ---------- всегда выключаем контейнеры ----------
      - name: Compose down
        if: always()
        run: docker compose down --volumes
