groups:
  - name: cleaner
    rules:
      - alert: CleanerHighErrorRateCritical
        expr: |
          sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) /
          sum(rate(http_server_requests_seconds_count[5m])) * 100 > 10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High error rate {{ $value | printf \"%.1f\" }} %"
          description: "5xx ratio exceeded 10 % for 10 minutes"

      - alert: CleanerLatencyCritical
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High p95 latency {{ $value | printf \"%.2f\" }} s"
          description: "p95 latency above 2 s for 5 minutes"

      - alert: CleanerJvmHeapCritical
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "JVM heap usage {{ $value | printf \"%.0f\" }} %"
          description: "Heap usage over 90 % for 10 minutes"