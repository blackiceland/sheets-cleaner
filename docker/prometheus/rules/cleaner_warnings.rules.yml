groups:
  - name: cleaner_rules
    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_server_requests_seconds_count{
            application="sheets-data-cleaner",
            status=~"5.."
          }[1m]) > 0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Пошёл поток 5xx ({{ $value }})"
