global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cleaner
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['cleaner:8081']

  - job_name: similarity
    metrics_path: /metrics
    static_configs:
      - targets: ['similarity:5000']

rule_files:
  - /etc/prometheus/rules/*.yml
